<div class="container-central">
  <div class="card">
    <form class="mt-60" #clientesFrm="ngForm">
      
      <mat-card>
        <mat-card-header>
          <mat-card-title>Dados Pessoais</mat-card-title>
        </mat-card-header>
        <mat-card-content class="mat-20">
          <div fxLayout="column" fxLayoutAlihn="start" fxLayoutGap="16px">
            <div fxLayout="row" fxFlex="800px">
            <mat-form-field class="full-width" >
              <mat-label>Nome: *</mat-label>
              <input type="text" matInput placeholder="EX: José da Silva" name="nome" ngModel>
            </mat-form-field>
            </div>
          </div>

          <div fxLayout="column" fxLayoutAlihn="start" fxLayoutGap="16px">
            <div fxLayout="row" fxFlex="400px">
            <mat-form-field class="full-width" >
              <mat-label>Email: *</mat-label>
              <input type="text" matInput placeholder="Digite Seu Email" name="nome" ngModel>
            </mat-form-field>
            </div>
          </div>

          <div fxLayout="column" fxLayoutAlihn="start" fxLayoutGap="16px">
            <div fxLayout="row" fxFlex="400px" class="mt-400">
            <mat-form-field class="full-width" >
              <mat-label>CPF: *</mat-label>
              <input type="email" matInput placeholder="Digite Seu CPF" name="nome" ngModel>
            </mat-form-field>
            </div>
          </div>

           <div fxLayout="column" fxLayoutAlihn="start" fxLayoutGap="16px">
            <div fxLayout="row" fxFlex="400px" class="mt-400">
            <mat-form-field class="full-width" >
              <mat-label>Data Nascimento: *</mat-label>
              <input type="email" matInput placeholder="Digite Sua data de nascimento" name="nome" ngModel>
            </mat-form-field>
            </div>
          </div>
        </mat-card-content>
        <mat-card-actions>
            
                <div fxLayout="column">
                    <button mat-flat-button color="primary" class="ml-5"><mat-icon fontIcon="save"></mat-icon>Salvar</button>

                </div>
         

            <div fxLayout="row">
                <div fxLayout="column">
                    <button mat-raised-button color="warn" class="ml-5"><mat-icon fontIcon="save"></mat-icon>Atualizar</button>

                </div>
            </div>

            <div fxLayout="row">
                <div fxLayout="column">
                    <button mat-raised-button color="warn" class="ml-5"><mat-icon fontIcon="save"></mat-icon>Limpar</button>

                </div>
            </div>

          
          
        </mat-card-actions>
      </mat-card>

    </form>
  </div>
</div>
